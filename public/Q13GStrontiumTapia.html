<!DOCTYPE html>
<html>
<body>

   <h2> Q1 3rd Graded Exercise submitted by Reeva Eemerille Tapia of 9-Strontium</h2>
   <p>Guess the Number:**** </p> 

   <p>The number is from 1 to 100 </p>
   <label> Enter your guess: </label>
   <input id="in1" type="text" placeholder="Number"> <br> 
   <br>
   <button onclick="checkIt()">Check It</button> <br>
   <br>
   <label> Result: </label>
   <p id="output"></p>
   <script>
       var dNumber = Math.floor(Math.random() * 100) + 1;

       function checkIt() {
           var guess = parseInt(document.getElementById("in1").value);

           if (isNaN(guess) || guess < 1 || guess > 100) {
               alert("Please enter a valid number from 1 to 100.");
               return;
           }

           if (guess === dNumber) {
               document.getElementById("output").textContent = "You are correct";
           } else if (guess < dNumber) {
               document.getElementById("output").textContent = "Higher";
           } else {
               document.getElementById("output").textContent = "Lower";
           }

           document.getElementById("in1").value = ""; // Clear the input field
       }
   </script>

</body>
</html>
